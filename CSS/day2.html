
<!DOCTYPE html>
<html>
<head>
<style>
div {
  border: 1px solid black;
  margin-top: 100px;
  margin-bottom: 100px;
  margin-right: 150px;
  margin-left: 80px;
  background-color: yellow;
} 
p {  
    background-color: pink;  
}  
p.ex {  
    margin: 50px 100px 150px 200px;  
}
p.dw {
  width:300px;
  margin: auto;
  border: 1px solid red;
}
div.a {
  height: auto;
  border: 1px solid black;
}

div.b {
  height: 50px;
  border: 1px solid black;  
}
</style>
</head>
<body>

<div>This div element has a top margin of 100px, a right margin of 150px, a bottom margin 
of 100px, and a left margin of 80px.</div>
<p>This paragraph is not displayed with specified margin. </p>  
<p class="ex">This paragraph is displayed with specified margin.</p>  

<p class="dw">This div will be horizontally centered because it has margin: auto;
</p>
</body>
</html>
