<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            margin: 0;
        }
        h1{
            color: #e2583e;
            font-family: sans-serif;
        }
        table{
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
        }
        td{
            width: 50%;
            vertical-align: middle;
        }
        td.left {
            background: linear-gradient(to bottom, lightsteelblue, peachpuff);
        }
        form{
            padding: 50px;
            vertical-align: middle;
            margin: middle;
        }
        
        input.sub{
            background-color: #e2583e;
            color: white;
            text-align: center;
            width: 100%;
            padding: 10px;
        }
        input.no{
            width: 20px;
        }
        input[type="email"],
        input[type="password"]{
            padding: 10px;
            width: 100%;
            text-align: center;
        }
        @media (max-width: 800px) {
    td {
        width: 100%;
    }
    td.left {
        display: none;
    }
    form{
    padding: 50px;
    vertical-align: middle;
    margin: middle;
}
}
    </style>
</head>
<body>
    <table>
        <td class="left"></td>
    <td>
    <form action="home.html" target="_blank">
    <h1>Login Form</h1>
    <label for="Email">Email:</label><br>
    <input type="email" required placeholder="abchegh123@gmail.com"><br>
    <label for="password">password:</label><br>
    <input type="password" required placeholder="1234567890"><br>
    <input class="no" type="checkbox" name="Remember me" id="Remember" required>
    <label for="Remember">Remember me</label><br>
    <input class="sub" type="submit" value="Login">
    </form>
    </td>
    </table>
</body>
</html>
