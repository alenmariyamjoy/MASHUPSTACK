
<!DOCTYPE html>
<html>
<head>
    <title>Negative Margin Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h2 {
            margin-top: 30px;
        }

        .box {
            width: 250px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        /* Normal margin */
        .normal1 {
            background-color: lightblue;
        }

        .normal2 {
            background-color: lightcoral;
            margin-top: 0px;
        }

        /* Positive margin */
        .positive1 {
            background-color: lightblue;
        }

        .positive2 {
            background-color: lightcoral;
            margin-top: 30px;
        }

        /* Negative margin */
        .negative1 {
            background-color: lightblue;
        }

        .negative2 {
            background-color: lightcoral;
            margin-top: -80px;
        }
    </style>
</head>

<body>

    <h2>1. Normal Margin (0px)</h2>
    <div class="box normal1">BOX 1</div>
    <div class="box normal2">BOX 2</div>

    <h2>2. Positive Margin (30px)</h2>
    <div class="box positive1">BOX 1</div>
    <div class="box positive2">BOX 2</div>

    <h2>3. Negative Margin (-30px)</h2>
    <div class="box negative1">BOX 1</div>
    <div class="box negative2">BOX 2</div>

</body>
</html>
