<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product card</title>
    <style>
        div{
            border-radius: 70px;
            border: 5px solid black;
            background-color: rgb(115, 179, 181);
            text-align: center;
            padding: 20px;
            margin: 30px 30px;
            max-width: fit-content;
            min-width: fit-content;
            width: auto;
            height: 400px;
            border-width: 10px 10px;
        }
        img{
            width: 45%;
            max-width: 100%;
            min-width: 200px;
            border-radius: 30px;
        }
        h2{
            padding: auto;
            color: rgb(8, 7, 84);
        }
        p{
            padding: auto;
            
        }
    </style>
</head>
<body>
    <div >
        <img src="White and Purple Running Sneakers.png" alt="running shoes">
        <h2>Running shoe</h2>
        <p>Comfortable and stylish running shoes. <br>
            Perfect for daily use and sports activities.</p>
    </div>
</body>
</html>
