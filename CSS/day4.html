<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <head>
<style>
div.one {
      border:5px solid #4FFFA1;
    }
div.two {
      border:5px solid #CCCCCC;
    }
    div.first {
      border:5px solid #4FFFA1;
      width:200px;
    }
    div.second {
      position: relative;
      left: 100px;
      width:200px;
      border:5px solid #CCCCCC;
    }
    div.third {
      position: relative;
      left: 100px;
      width:200px;
      border:5px solid #ee3e64;
    }
     div.four {
    border:5px solid #4FFFA1;
      width:200px;
    }
    div.five {
      width:200px;
      border:5px solid #CCCCCC;
    }
    div.six {
      position: fixed;
      top: 0px;
      right:0px;
      width:200px;
      border:5px solid #ee3e64;
    }
     div.seven {
        width: 200px;
        border: 5px solid #CCCCCC;
    }

    div.eight {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 200px;
        border: 5px solid #ee3e64;
    }
</style>
</head>
<body>
     <div class="one">Static Position Example - 1</div>
  <div class="two">Static Position Example - 2 </div>
  <div class="first">First Div</div>
  <div class="second">Second Div</div>
  <div class="third">Third Div</div>
    <div class="four">
    One<br>
    Two<br>
    Three<br>
    Four<br>
    Five<br>
  </div>
  <div class="five">
    Six<br>
    Seven<br>
    Eight<br>
    Nine<br>
    Ten<br>
  </div>
  <div class="seven">Fix Here</div>
   <div class="second">
        Second Div

        <div class="eight">Third Div</div>
    </div>
</body>
</html>
