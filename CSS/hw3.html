<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>resturant menu</title>
    <link rel="stylesheet"   
href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"> 
    <style>
        h3{
            text-align: right;
            font-family: Arial, Helvetica, sans-serif;
            font-size: x-large;
            color: navy;
        }
        p{
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            word-spacing: 5px;
        }
        table,th,td{
            border: 1px solid black;
             vertical-align: middle;
        }
        th{
            text-align: center;
            margin: auto;
        }
        table{
            border-collapse: collapse;
            width: 60%;
            text-align: center;
            margin: auto;
        }
        .glyphicon{  
            color:red;  
            font-size:50px;  
            margin:10px;  
}  
a{
    text-decoration: none;
    color: blue;
}
a:hover{
    color: red;
}
    </style>
</head>
<body>
    <h3>Spice Garden Restaurant</h3><br>
    <p>Welcome to Spice Garden! Enjoy our delicious food, freshly prepared with love.</p>
    <br>
    <div>
        <table border="1">
            <tr>
                <th>Menu Item</th>
                <th>Price</th>
            </tr>
            <tr>
                <td>Chicken Biryani</td>
                <td>₹180</td>
            </tr>
            <tr>
                <td>Veg Fried Rice</td>
                <td>₹120</td>
            </tr>
            <tr>
                <td>Paneer Butter Masala</td>
                <td>₹160</td>
            </tr>
        </table>
    </div>
    <br>
        <i class="glyphicon glyphicon-cloud"></i>    
        <i class="glyphicon glyphicon-heart"></i> 
       <br><br>
