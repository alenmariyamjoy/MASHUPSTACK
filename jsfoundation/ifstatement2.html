    <h1>task 1</h1>
    <p id="fever"></p>
    <script>
        let temperature = 38.5;
        var patientStatus;
        if(temperature<0||temperature>40){
            patientStatus = "Invalid Temperature"
        }
        else{
        if(temperature<36){
            patientStatus = "Low Temperature";
        }
        else if(temperature>=36&&temperature<=37.5){
            patientStatus = "Normal";
        }
        else if(temperature>37.5&&temperature<=38.5){
            patientStatus = "Mild fever";
        }
        else{
            patientStatus = "High Fever";
        }
        }
        document.getElementById("fever").innerHTML = (temperature+" "+"°C"+" "+patientStatus)
    </script>

    <h1>task 3</h1>
    <p id="rail"></p>
    <script>
        let passengerAge = 60;
        let ticketFare = 500;
        var finalFare;
        var fare;
        if(passengerAge<5){
            fare = "free",finalFare = "0";
        }else if(passengerAge>=5&&passengerAge<=12){
            fare = " 50% of original fare",finalFare = (ticketFare*50)/100;
        }else if(passengerAge>=13&&passengerAge<=59){
            fare = "Full Fare",finalFare = ticketFare;
        }else if(passengerAge>=60){
            fare = " 70% of original fare",finalFare = (ticketFare*70)/100;
        }
        document.getElementById("rail").innerHTML = ("The passenger age is = "+" "+passengerAge+" "+" <br>and the fare is"+" "+fare+" "+" <br>and the final fare is = "+" "+finalFare);
            
    </script>

    <h1>task 4</h1>
    <p id="data"></p>
    <p id="rem"></p>
    <script>
        let dataUsed = 110;
        var status;
        var Remainingdata;
        var totaldata = 100;
        if(dataUsed<0){
            status = "Invalid data";
        }
        if(dataUsed<50){
            status ="Normal Usage";
        }else if(dataUsed>=50&&dataUsed<=79){
            status = "Moderate Usage";
        }else if(dataUsed>=80&&dataUsed<=99){
            status = " Warning: Data Almost Exhausted";
        }else {
            status = " Data Limit Exceeded";
        }
        
        Remainingdata = (totaldata-dataUsed);
    
        document.getElementById("data").innerHTML = ("Monthly Data Limit: "+totaldata+"<br>"+"Data Used:"+dataUsed);
    
        document.getElementById("rem").innerHTML = ("Remaining Data:"+Remainingdata+"<br>"+"Usage Status:"+status);
        
    </script>
