<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>variables</title>
</head>
<body>
    <!--integer,boolean,string-->
    <p id="intg"></p>
    <p id="boo"></p>
    <p id="strg"></p>
    <h1 id="ari"></h1>
    <script>
        var x = 4
        let boole = true
        var y = "this"+" "+"is"+" "+"a"+" "+"string"
        let z = 5+6+8
        document.getElementById("intg").innerHTML = x
        document.getElementById("boo").innerHTML = boole
        document.getElementById("strg").innerHTML = y
        document.getElementById("ari").innerHTML = z
        console.log(x);
        console.log(boole);
        console.log(y);
        alert(x)
        alert(boole)
        alert(y)
    </script>
</body>
</html>
