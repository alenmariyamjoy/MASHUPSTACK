 <h1>Task 14</h1>

    <p id="calculator"></p>

<script>
    let num1 = 20;
    let num2 = 5;
    let operator = "*";
    let result;

    if (operator == "+") {
        result = num1 + num2;
    }
    else if (operator == "-") {
        result = num1 - num2;
    }
    else if (operator == "*") {
        result = num1 * num2;
    }
    else if (operator == "/") {
        if (num2 == 0) {
            result = "Cannot divide by zero";
        }
        else {
            result = num1 / num2;
        }
    }
    else {
        result = "Invalid operator";
    }

    console.log(num1 + " " + operator + " " + num2 + " = " + result);

    document.getElementById("calculator").innerHTML =
        num1 + " " + operator + " " + num2 + " = " + result;
</script>
    
     <h1>Task 15</h1>

 <p id="bonus"></p>

<script>
    let performanceScore = 82;
    let salary = 30000;

    let bonusPercentage;
    let bonusAmount;

    if (performanceScore < 0 || performanceScore > 100) {
        bonusPercentage = "Invalid Score";
        bonusAmount = "Not Applicable";
    }
    else if (performanceScore >= 90) {
        bonusPercentage = 20;
    }
    else if (performanceScore >= 75) {
        bonusPercentage = 10;
    }
    else if (performanceScore >= 60) {
        bonusPercentage = 5;
    }
    else {
        bonusPercentage = 0;
    }

    if (typeof bonusPercentage == "number") {
        bonusAmount = salary * bonusPercentage / 100;
    }

    console.log("Performance Score: " + performanceScore);
    console.log("Bonus Percentage: " + bonusPercentage);
    console.log("Bonus Amount: " + bonusAmount);

    document.getElementById("bonus").innerHTML =
        "Performance Score: " + performanceScore +"Bonus Percentage: " + bonusPercentage +"Bonus Amount: " + bonusAmount;
</script>
