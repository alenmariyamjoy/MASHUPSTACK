<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact us</title>
</head>
<body>
    <h1>Contact Us</h1>
    <form action="">
        <label for="fname">First Name:</label>
        <input type="text" name="fname" id="fname" required placeholder="first name" maxlength="20">
        <label for="lname">Last name:</label>
        <input type="text" name="lname" id="lname" required placeholder="last name" maxlength="20"><br><br>
        <label for="email">Email Address:</label>
        <input type="email" name="email" id="email" required placeholder="example.@gmail.com"><br><br>
        <label for="phone">Phone Number:</label>
        <input type="text" id="phno" maxlength="10"  size="10" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required><br><br>
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" placeholder="Enter Topic" maxlength="100" required><br><br>
        <!--label for="Message">Message</label-->
        Message:
        <br/>
        <textarea name="Message" rows="5" cols="50"></textarea><br><br>
        <input type="submit" value="submit"><br><br>
        &copy;
    </form>
</body>
</html>
