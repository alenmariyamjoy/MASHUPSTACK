<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
   <div class="container">
    <h1>Course Progress Dashboard</h1>
    <ul class="breadcrumb">
        <li class="breadcrumb-item"><a href="#">Home</a></li>
        <li class="breadcrumb-item"><a href="#">Courses</a></li>
        <li class="breadcrumb-item"><a href="#">Web Development</a></li>
    </ul>
    <h2 class="badge badge-primary badge-pill" style="font-size: 20px;">Web Development Course <span class="badge badge-light">New</span></h2>
    <div class="progress">
        <div  class="progress-bar bg-success progress-bar-striped" style="width: 100%;">HTML - 100%</div>
        <div  class="progress-bar bg-primary progress-bar-striped progress-bar-animated " style="width: 75%;">CSS - 75%</div>
        <div  class="progress-bar bg-warning" style="width: 50%;">JavaScript - 50%</div>
        <div  class="progress-bar bg-danger" style="width: 25%;">BootStrap - 25%</div>
    </div><br>
    <div>
    <button type="button" class="btn btn-success btn-lg">Start</button>
    <button type="button" class="btn btn-warning btn-lg">Pause</button>
    <button type="button" class="btn btn-danger btn-lg">Reset</button>
    </div>
    <br>
    <ul class="pagination">
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item disabled"><a class="page-link" href="#">3</a></li>
    </ul>
   </div>
</body>
</html>
